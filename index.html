<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday! ♥</title>

<script>
/* ===========================================================
   ✏️  EDIT ME — change these lines, then save the file.
   =========================================================== */
const CONFIG = {
  name:    "Baby",                       // 👈 HIS NAME (or nickname) goes here
  message: "Happy 20th birthday! You're officially 20 now 🎉\nMay God bless you always, keep you healthy and guide every step you take.\nI pray you succeed in everything you dream of. I'm so proud of you and I'll always be here cheering you on ♥",   // 👈 YOUR MESSAGE (type \n where you want a new line)
  from:    "Love, me",                   // 👈 how you want to sign it
  caption: "Birthday Boy 🎂"              // 👈 text under his photo
};
/* (His photo is embedded at the very bottom of this file.) */
</script>

<style>
  :root{
    --W: min(76vw, 330px, 37vh);           /* card size */
    --pink:#3fa9ff; --rose:#f2c14e; --deep:#f2c14e; --mango:#f2c14e;
    --mint:#2ec4b6; --sky:#3fa9ff; --lilac:#8b9bb4; --cream:#f3efe6;
    --ink:#e3e9f5;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    color:var(--ink);
    background:radial-gradient(ellipse at 50% 20%,#1a2540 0%,#0d1322 55%,#05070d 100%) fixed;
    overflow:hidden;
    user-select:none;-webkit-user-select:none;
  }
  /* soft bokeh dots in the background */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
    background:
      radial-gradient(circle at 12% 18%,#fff 0 6px,transparent 7px),
      radial-gradient(circle at 85% 12%,#fff 0 4px,transparent 5px),
      radial-gradient(circle at 70% 80%,#fff 0 7px,transparent 8px),
      radial-gradient(circle at 25% 75%,#ffffffaa 0 30px,transparent 31px),
      radial-gradient(circle at 92% 55%,#ffffff88 0 45px,transparent 46px),
      radial-gradient(circle at 5% 50%,#ffffff77 0 22px,transparent 23px),
      radial-gradient(circle at 50% 5%,#ffffff66 0 18px,transparent 19px);
    animation:twinkle 6s ease-in-out infinite alternate;
  }
  @keyframes twinkle{to{opacity:.35;transform:translateY(-8px)}}
  .script{font-family:"Segoe Script","Brush Script MT","Snell Roundhand","Savoye LET","Dancing Script",cursive}

  /* =================== STAGE 1 : ENVELOPE =================== */
  .env-stage{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(18px,4vh,34px);padding:20px;
  }
  .env-stage.hidden{display:none}
  .intro{ text-align:center; font-size:clamp(20px,5.2vw,28px); color:var(--deep); line-height:1.25;
          animation:bob 3s ease-in-out infinite}
  .intro small{display:block;font-family:inherit;font-size:.55em;letter-spacing:.18em;text-transform:uppercase;color:#8fa6c8;margin-bottom:6px}
  @keyframes bob{50%{transform:translateY(-6px)}}

  .envelope{
    --E:min(84vw,380px);
    --p:0;
    position:relative;width:var(--E);height:calc(var(--E)*.64);
    perspective:900px;touch-action:none;cursor:grab;
    filter:drop-shadow(0 18px 26px rgba(0,0,0,.6));
  }
  .envelope:active{cursor:grabbing}
  .env-back,.env-front,.flap,.letter{position:absolute;left:0;width:100%}
  .env-back{inset:0;height:100%;border-radius:12px;background:#151b28;z-index:0}
  .letter{
    left:6%;width:88%;top:6%;height:88%;z-index:2;border-radius:8px;
    background:var(--cream);
    background-image:radial-gradient(#ddd5c4 1.2px,transparent 1.6px);background-size:14px 14px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:9%;
    transform:translateY(calc(var(--p) * -34%));
  }
  .letter .to{font-size:calc(var(--E)*.085);color:#1d2a44}
  .letter .mini{font-size:calc(var(--E)*.032);letter-spacing:.25em;text-transform:uppercase;color:#8a7a55;margin-top:4px}
  .env-front{
    inset:0;height:100%;z-index:3;border-radius:12px;
    background:linear-gradient(170deg,#2b3549,#1a2130);
    clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);
  }
  .env-front::after{ /* little side folds */
    content:"";position:absolute;inset:0;
    background:linear-gradient(20deg,rgba(0,0,0,.06) 50%,transparent 50%),linear-gradient(-20deg,rgba(0,0,0,.06) 50%,transparent 50%);
    background-size:50% 100%;background-repeat:no-repeat;background-position:left,right;
  }
  .flap{
    top:0;height:60%;z-index:4;transform-origin:50% 0;
    background:linear-gradient(180deg,#36425b,#262f42);
    clip-path:polygon(0 0,100% 0,50% 100%);
    border-radius:12px 12px 0 0;
    transform:rotateX(calc(var(--p) * 180deg));
  }
  .envelope.flap-open .flap{z-index:1;background:linear-gradient(0deg,#1c2333,#151b28)}
  .seal{
    position:absolute;left:50%;top:60%;z-index:5;width:calc(var(--E)*.15);height:calc(var(--E)*.15);
    transform:translate(-50%,-55%) scale(calc(1 - var(--p)*1.4));opacity:calc(1 - var(--p)*3);
    border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle at 35% 30%,#ffe08a,#a8781a 70%);
    box-shadow:0 3px 6px rgba(0,0,0,.25), inset 0 -3px 6px rgba(0,0,0,.25);
  }
  .seal svg{width:52%;fill:#4a3408}

  /* slider */
  .slider{
    position:relative;width:min(84vw,380px);height:60px;border-radius:40px;
    background:rgba(255,255,255,.07);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    box-shadow:inset 0 2px 6px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);
    touch-action:none;
  }
  .slider .label{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-left:40px;
    font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:14px;
    background:linear-gradient(90deg,#7f93b5 0%,#7f93b5 40%,#fff 50%,#7f93b5 60%,#7f93b5 100%);
    background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 2.4s linear infinite;pointer-events:none;
  }
  @keyframes shine{from{background-position:100% 0}to{background-position:-150% 0}}
  .knob{
    position:absolute;top:5px;left:5px;width:50px;height:50px;border-radius:50%;border:0;cursor:grab;
    background:linear-gradient(145deg,#4fb3ff,#1d6fd1);color:#fff;
    box-shadow:0 4px 14px rgba(40,130,255,.5);display:grid;place-items:center;touch-action:none;
  }
  .knob:active{cursor:grabbing}
  .knob svg{width:26px;height:26px}
  .knob.nudge{animation:nudge .9s ease}
  @keyframes nudge{30%{margin-left:38px}60%{margin-left:0}75%{margin-left:14px}}
  .knob:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .hint{font-size:13px;color:#7f93b5;margin-top:-10px;opacity:.85}

  /* leaving animation */
  .leaving .letter{animation:letterOut 1.2s cubic-bezier(.5,0,.3,1) forwards;z-index:6}
  .leaving .env-back,.leaving .env-front,.leaving .seal{animation:envDrop .8s .45s ease-in forwards}
  .leaving .flap{animation:flapDrop .8s .45s ease-in forwards}
  .leaving .slider,.leaving .intro,.leaving .hint{transition:opacity .4s;opacity:0}
  @keyframes letterOut{
    0%{transform:translateY(-34%)}
    45%{transform:translateY(-95%) rotate(-2deg)}
    100%{transform:translateY(-40%) scale(1.35);opacity:0}
  }
  @keyframes envDrop{to{transform:translateY(70vh) rotate(8deg);opacity:0}}
  @keyframes flapDrop{to{transform:translateY(70vh) rotate(8deg) rotateX(180deg);opacity:0}}
  .no-anim *, .no-anim{animation:none!important;transition:none!important}

  /* =================== STAGE 2 : POP-UP CARD =================== */
  .pop-stage{
    position:fixed;inset:0;display:none;overflow-x:hidden;overflow-y:auto;
    padding:clamp(14px,3vh,28px) 16px 30px;
  }
  .pop-stage.show{display:block}
  .pop-inner{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.6vh,16px)}

  .title{ text-align:center;line-height:1;z-index:5;position:relative }
  .title .word{display:inline-block;white-space:nowrap}
  .title .ch{
    display:inline-block;font-weight:900;font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
    font-size:clamp(34px,10.5vw,64px);
    text-shadow: 3px 3px 0 #0b1020,-3px 3px 0 #0b1020,3px -3px 0 #0b1020,-3px -3px 0 #0b1020,0 3px 0 #0b1020,0 -3px 0 #0b1020,3px 0 0 #0b1020,-3px 0 0 #0b1020, 0 0 22px rgba(63,169,255,.35), 0 8px 0 rgba(0,0,0,.45);
    opacity:0;transform:translateY(-60px) scale(.3) rotate(-20deg);
  }
  .opened .title .ch{animation:letterPop .7s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:calc(1.7s + var(--i)*.06s)}
  @keyframes letterPop{to{opacity:1;transform:translateY(0) scale(1) rotate(var(--r,0deg))}}
  .live .title .ch{animation:letterPop .01s forwards, wiggle 2.6s ease-in-out infinite;animation-delay:0s, calc(var(--i)*.12s)}
  @keyframes wiggle{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-5px) rotate(calc(var(--r,0deg) * -1))}}
  .title .name{
    display:block;font-size:clamp(28px,8vw,46px);color:var(--deep);margin-top:4px;
    opacity:0;transform:scale(.6);transition:all .8s cubic-bezier(.3,1.6,.5,1) 2.6s;
    text-shadow:0 2px 0 #000, 0 0 18px rgba(242,193,78,.35);
  }
  .opened .title .name{opacity:1;transform:scale(1)}

  /* --- 3D book --- */
  .scene{
    perspective:1100px;perspective-origin:50% 20%;
    width:var(--W);
    padding-bottom:calc(var(--W)*.64);   /* room for the floor page */
    margin-top:calc(var(--W)*.06);
    position:relative;
  }
  .book{
    --rx:-62deg; --ry:0deg; --ty:-100%;
    position:relative;width:var(--W);height:calc(var(--W)*.9);
    transform-style:preserve-3d;transform-origin:50% 100%;
    transform:translateY(var(--ty)) rotateY(var(--ry)) rotateX(var(--rx)) scale(.92);
    transition:transform 1.5s cubic-bezier(.6,.05,.25,1) .1s;
  }
  .opened .book{--rx:0deg;--ty:0%;transform:translateY(var(--ty)) rotateY(var(--ry)) rotateX(var(--rx)) scale(1)}
  .live .book{transition:transform .5s ease-out}

  .page{position:absolute;left:0;width:100%;height:100%;transform-style:preserve-3d}
  .page.back{top:0;transform-origin:50% 100%;transform:rotateX(-117deg);
             transition:transform 1.5s cubic-bezier(.55,0,.25,1) .9s}
  .opened .page.back{transform:rotateX(0deg)}
  .page.base{top:100%;transform-origin:50% 0;transform:rotateX(62deg)}

  .face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
  .back .inside{
    background:#1a2236;
    background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 2px);background-size:16px 16px;
    box-shadow:inset 0 -14px 18px -10px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.06);
  }
  .back .inside .garland{position:absolute;top:2%;left:-2%;width:104%}
  .back .inside .stars{position:absolute;inset:0;
    background:
     radial-gradient(circle at 8% 40%,var(--mango) 0 3px,transparent 4px),
     radial-gradient(circle at 92% 30%,var(--sky) 0 3px,transparent 4px),
     radial-gradient(circle at 12% 70%,var(--lilac) 0 4px,transparent 5px),
     radial-gradient(circle at 88% 66%,var(--mint) 0 4px,transparent 5px),
     radial-gradient(circle at 50% 22%,var(--pink) 0 3px,transparent 4px);}
  .back .cover{
    transform:rotateX(180deg);
    background:linear-gradient(160deg,#2c3852,#121826);
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:6px;
  }
  .back .cover .to{font-size:calc(var(--W)*.12);text-shadow:0 2px 0 rgba(0,0,0,.12)}
  .back .cover .mini{font-size:calc(var(--W)*.04);letter-spacing:.3em;text-transform:uppercase;opacity:.9}
  .back .cover svg{width:22%;fill:#f2c14e;opacity:.95}

  .base .inside{
    background:#141b2b;
    background-image:
      radial-gradient(circle,var(--mango) 0 2px,transparent 2.5px),
      radial-gradient(circle,var(--sky) 0 2px,transparent 2.5px),
      radial-gradient(circle,var(--pink) 0 2px,transparent 2.5px);
    background-size:38px 38px,52px 52px,30px 30px;background-position:0 0,13px 21px,7px 9px;
    box-shadow:inset 0 14px 18px -10px rgba(0,0,0,.5), 0 30px 40px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.06);
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:6%;
  }
  .base .inside span{font-size:calc(var(--W)*.08);color:var(--rose)}

  /* pop-up pieces (they live on the floor page and stand up) */
  .pop{
    position:absolute;transform-origin:50% 100%;transform:rotateX(-8deg);opacity:0;
    transition:transform 1s cubic-bezier(.3,1.7,.55,1),opacity .3s;
    transition-delay:calc(1.45s + var(--d,0s));
  }
  .opened .pop{transform:rotateX(-62deg);opacity:1}
  .photo-pop{ --d:.05s; width:calc(var(--W)*.56);height:calc(var(--W)*.86);
              left:calc(var(--W)*.22);top:calc(var(--W)*(.32 - .86));cursor:pointer}
  .polaroid{
    width:100%;height:100%;background:#fff;border-radius:6px;padding:6% 6% 0;
    box-shadow:0 10px 24px rgba(0,0,0,.55);display:flex;flex-direction:column;
    transform:rotate(-2deg);
  }
  .polaroid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:3px;display:block;pointer-events:none}
  .polaroid .cap{flex:1;display:grid;place-items:center;font-size:calc(var(--W)*.062);color:#1d2a44;white-space:nowrap}
  .photo-pop::before{ /* tiny tape */
    content:"";position:absolute;top:-4%;left:38%;width:24%;height:7%;z-index:2;
    background:rgba(255,220,120,.75);transform:rotate(-6deg);border-radius:2px;
  }
  .bal-l{--d:.25s;width:calc(var(--W)*.28);height:calc(var(--W)*.66);left:calc(var(--W)*-.06);top:calc(var(--W)*(.14 - .66))}
  .bal-r{--d:.35s;width:calc(var(--W)*.28);height:calc(var(--W)*.66);left:calc(var(--W)*.78);top:calc(var(--W)*(.1 - .66))}
  .gift-l{--d:.5s;width:calc(var(--W)*.2);height:calc(var(--W)*.19);left:calc(var(--W)*.03);top:calc(var(--W)*(.6 - .19))}
  .gift-r{--d:.6s;width:calc(var(--W)*.17);height:calc(var(--W)*.16);left:calc(var(--W)*.8);top:calc(var(--W)*(.55 - .16))}
  .pop svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 5px rgba(0,0,0,.5));overflow:visible}

  .floor-shadow{position:absolute;left:5%;right:5%;bottom:calc(var(--W)*.02);height:calc(var(--W)*.1);
    background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%);opacity:0;transition:opacity 1s 1.2s}
  .opened .floor-shadow{opacity:1}

  /* message note */
  .note{
    position:relative;width:min(88vw,380px);background:#161e2f;border-radius:14px;border:1px solid rgba(255,255,255,.07);
    padding:18px 20px 16px;box-shadow:0 12px 30px rgba(0,0,0,.5);
    opacity:0;transform:translateY(30px) rotate(1deg);transition:all .9s cubic-bezier(.3,1.4,.5,1) 3s;
    background-image:repeating-linear-gradient(transparent 0 27px,rgba(255,255,255,.06) 27px 28px);background-position:0 14px;
  }
  .opened .note{opacity:1;transform:translateY(0) rotate(-1deg)}
  .note::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:20px;transform:translateX(-50%) rotate(2deg);
    background:rgba(242,193,78,.75);border-radius:3px}
  .note h2{font-weight:400;font-size:24px;color:var(--rose);margin-bottom:4px}
  .note p{font-size:16px;line-height:28px;white-space:pre-line;color:#dfe6f3}
  .note .from{text-align:right;font-size:20px;color:var(--rose);margin-top:6px}

  .replay{
    margin-top:4px;border:0;border-radius:30px;padding:11px 22px;font:700 14px/1 inherit;font-family:inherit;
    letter-spacing:.08em;color:#fff;background:linear-gradient(145deg,#4fb3ff,#1d6fd1);cursor:pointer;
    box-shadow:0 6px 16px rgba(40,130,255,.35);opacity:0;transition:opacity .6s 3.6s, transform .2s;
  }
  .opened .replay{opacity:1}
  .replay:active{transform:scale(.95)}

  /* laptop / landscape: book left, note right */
  @media (min-width:860px) and (min-aspect-ratio:5/4){
    :root{--W:min(34vw,360px,46vh)}
    .pop-inner{display:grid;grid-template-columns:auto auto;grid-template-areas:"title title" "scene side";
               column-gap:clamp(30px,6vw,90px);align-content:center;justify-content:center;align-items:center}
    .title{grid-area:title}
    .scene{grid-area:scene}
    .side{grid-area:side;display:flex;flex-direction:column;align-items:center;gap:16px}
  }
  .side{display:flex;flex-direction:column;align-items:center;gap:14px}

  /* effects */
  #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
  .floaty{position:fixed;bottom:-80px;pointer-events:none;z-index:40;animation:floatUp var(--dur) linear forwards}
  .floaty > *{display:block;animation:sway 3s ease-in-out infinite alternate}
  @keyframes floatUp{to{transform:translateY(calc(-100vh - 160px))}}
  @keyframes sway{from{transform:translateX(-14px) rotate(-6deg)}to{transform:translateX(14px) rotate(6deg)}}
  .spark{position:fixed;pointer-events:none;z-index:60;animation:spark .9s ease-out forwards}
  @keyframes spark{to{transform:translate(var(--x),var(--y)) scale(.4);opacity:0}}

  @media (prefers-reduced-motion:reduce){
    .floaty,.title .ch{animation-duration:.01s!important}
  }
</style>
</head>
<body>

<!-- ============ STAGE 1: the envelope ============ -->
<section class="env-stage" id="envStage">
  <div class="intro script"><small>a little something for</small><span class="js-name">Babe</span> ♥</div>

  <div class="envelope" id="envelope" aria-label="Envelope. Slide the heart to open.">
    <div class="env-back"></div>
    <div class="letter">
      <div class="to script">For <span class="js-name">Babe</span></div>
      <div class="mini">open me ♥</div>
    </div>
    <div class="env-front"></div>
    <div class="flap"></div>
    <div class="seal"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2.1 0 3.6 1.2 5.4 3.2 1.8-2 3.3-3.2 5.4-3.2 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg></div>
  </div>

  <div class="slider" id="slider">
    <div class="label">slide to open</div>
    <button class="knob" id="knob" aria-label="Slide to open the letter">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </button>
  </div>
  <div class="hint">drag the heart button → &nbsp;or swipe the letter up</div>
</section>

<!-- ============ STAGE 2: the pop-up card ============ -->
<section class="pop-stage" id="popStage">
  <div class="pop-inner">
    <h1 class="title" id="title" aria-label="Happy Birthday">
      <span class="word" data-text="Happy"></span>
      <span class="word" data-text="Birthday"></span>
      <span class="name script"><span class="js-name">Babe</span>!</span>
    </h1>

    <div class="scene">
      <div class="book" id="book">
        <div class="page back">
          <div class="face inside">
            <div class="stars"></div>
            <svg class="garland" viewBox="0 0 300 60" preserveAspectRatio="none">
              <path d="M0 6 Q150 46 300 6" fill="none" stroke="#8a96ad" stroke-width="1.5"/>
              <g id="flags"></g>
            </svg>
          </div>
          <div class="face cover">
            <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2.1 0 3.6 1.2 5.4 3.2 1.8-2 3.3-3.2 5.4-3.2 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg>
            <div class="to script">For <span class="js-name">Babe</span></div>
            <div class="mini">open me ♥</div>
          </div>
        </div>

        <div class="page base">
          <div class="face inside"><span class="script">make a wish ✨</span></div>

          <!-- pieces that pop up and stand -->
          <div class="pop bal-l">
            <svg viewBox="0 0 70 160">
              <path d="M24 66 q6 30 -4 50 q-8 20 12 44" stroke="#fff" stroke-width="1.6" fill="none"/>
              <path d="M48 58 q-8 34 4 56 q10 22 -16 46" stroke="#fff" stroke-width="1.6" fill="none"/>
              <ellipse cx="48" cy="32" rx="20" ry="25" fill="#3fa9ff" stroke="#fff" stroke-width="2.5"/>
              <ellipse cx="24" cy="44" rx="20" ry="25" fill="#1c2230" stroke="#fff" stroke-width="2.5"/>
              <ellipse cx="17" cy="35" rx="5" ry="8" fill="#fff" opacity=".45"/>
              <ellipse cx="41" cy="23" rx="5" ry="8" fill="#fff" opacity=".45"/>
            </svg>
          </div>
          <div class="pop bal-r">

<script>
document.addEventListener('DOMContentLoaded', () => {
  const $ = s => document.querySelector(s);
  const COLORS = ['#3fa9ff','#f2c14e','#ffffff','#2ec4b6','#8fa6c8','#5b8cff','#ffd97a'];

  /* ---- fill in the editable text ---- */
  document.querySelectorAll('.js-name').forEach(el => el.textContent = CONFIG.name);
  document.querySelectorAll('.js-caption').forEach(el => el.textContent = CONFIG.caption);
  $('#message').textContent = CONFIG.message;
  $('#from').textContent = CONFIG.from;
  document.title = 'Happy Birthday, ' + CONFIG.name + '! ♥';
  $('#photo').src = document.getElementById('photo-data').textContent.trim();

  /* ---- big festive title, letter by letter ---- */
  let idx = 0;
  document.querySelectorAll('.title .word').forEach(w => {
    [...w.dataset.text].forEach(c => {
      const s = document.createElement('span');
      s.className = 'ch'; s.textContent = c;
      s.style.color = COLORS[idx % 5];
      s.style.setProperty('--i', idx);
      s.style.setProperty('--r', ((idx % 3) - 1) * 4 + 'deg');
      w.appendChild(s); idx++;
    });
    w.insertAdjacentText('afterend', ' ');
  });

  /* ---- bunting flags on the inside page ---- */
  const flags = $('#flags');
  for (let i = 0; i < 9; i++) {
    const x = 12 + i * 34, t = x / 300, y = 6 + 4 * 40 * t * (1 - t) * 0.5 * 2 * 0.5 * 2;
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', `M${x-11} ${y} L${x+11} ${y} L${x} ${y+22} Z`);
    p.setAttribute('fill', COLORS[i % 5]);
    flags.appendChild(p);
  }

  /* =================== SLIDE TO OPEN =================== */
  const envStage = $('#envStage'), popStage = $('#popStage');
  const envelope = $('#envelope'), slider = $('#slider'), knob = $('#knob');
  let p = 0, opened = false, tween = null;

  const maxX = () => slider.clientWidth - knob.offsetWidth - 10;
  function setP(v) {
    p = Math.max(0, Math.min(1, v));
    envelope.style.setProperty('--p', p);
    knob.style.transform = `translateX(${p * maxX()}px)`;
    envelope.classList.toggle('flap-open', p > 0.5);
  }
  function animateTo(target, done) {
    cancelAnimationFrame(tween);
    const from = p, t0 = performance.now(), dur = 380;
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      setP(from + (target - from) * e);
      if (k < 1) tween = requestAnimationFrame(step); else done && done();
    };
    tween = requestAnimationFrame(step);
  }

  function makeDraggable(el, toProgress) {
    let start = null, startP = 0, moved = false;
    el.addEventListener('pointerdown', e => {
      if (opened) return;
      cancelAnimationFrame(tween);
      start = { x: e.clientX, y: e.clientY }; startP = p; moved = false;
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', e => {
      if (!start) return;
      const d = toProgress(e.clientX - start.x, e.clientY - start.y);
      if (Math.abs(d) > 0.01) moved = true;
      setP(startP + d);
    });
    const end = () => {
      if (!start) return;
      start = null;
      if (p > 0.75) animateTo(1, openCard);
      else {
        animateTo(0);
        if (!moved && el === knob) { knob.classList.remove('nudge'); void knob.offsetWidth; knob.classList.add('nudge'); }
      }
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }
  makeDraggable(knob, (dx) => dx / maxX());
  makeDraggable(envelope, (dx, dy) => Math.max(dx, -dy) / (envelope.offsetHeight * 0.9));
  knob.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); animateTo(1, openCard); }
  });
  // gentle nudge if he hasn't figured it out
  let idleNudge = setInterval(() => { if (!opened && p === 0) { knob.classList.remove('nudge'); void knob.offsetWidth; knob.classList.add('nudge'); } }, 4000);

  /* =================== OPEN SEQUENCE =================== */
  let timers = [], floatTimer = null;
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));

  function openCard() {
    if (opened) return;
    opened = true;
    envStage.classList.add('leaving');
    later(() => {
      envStage.classList.add('hidden');
      popStage.classList.add('show');
      popStage.scrollTop = 0;
      requestAnimationFrame(() => requestAnimationFrame(() => popStage.classList.add('opened')));
    }, 1150);
    later(() => confettiBurst(), 1150 + 1900);
    later(() => { floatTimer = setInterval(spawnFloaty, 650); for (let i = 0; i < 6; i++) setTimeout(spawnFloaty, i * 150); }, 1150 + 2200);
    later(() => popStage.classList.add('live'), 1150 + 3600);
  }

  $('#replay').addEventListener('click', () => {
    timers.forEach(clearTimeout); timers = [];
    clearInterval(floatTimer);
    document.querySelectorAll('.floaty').forEach(f => f.remove());
    popStage.classList.remove('show', 'opened', 'live');
    document.body.classList.add('no-anim');
    envStage.classList.remove('leaving', 'hidden');
    opened = false; setP(0);
    $('#book').style.setProperty('--ry', '0deg');
    void document.body.offsetWidth;
    document.body.classList.remove('no-anim');
  });

  /* ---- tilt the card with mouse / finger ---- */
  popStage.addEventListener('pointermove', e => {
    if (!popStage.classList.contains('live')) return;
    const r = $('.scene').getBoundingClientRect();
    const nx = ((e.clientX - (r.left + r.width / 2)) / (window.innerWidth / 2));
    $('#book').style.setProperty('--ry', (Math.max(-1, Math.min(1, nx)) * 14).toFixed(1) + 'deg');
  });

  /* ---- tap his photo for hearts ---- */
  $('#photoPop').addEventListener('click', e => {
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('div');
      s.className = 'spark';
      const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 90;
      s.style.left = e.clientX - 10 + 'px'; s.style.top = e.clientY - 10 + 'px';
      s.style.setProperty('--x', Math.cos(a) * d + 'px'); s.style.setProperty('--y', Math.sin(a) * d - 40 + 'px');
      s.innerHTML = heartSVG(16 + Math.random() * 14, COLORS[i % COLORS.length]);
      document.body.appendChild(s);
      s.addEventListener('animationend', () => s.remove());
    }
  });

  /* =================== FLOATING HEARTS & BALLOONS =================== */
  function heartSVG(size, color) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24"><path fill="${color}" d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2.1 0 3.6 1.2 5.4 3.2 1.8-2 3.3-3.2 5.4-3.2 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg>`;
  }
  function balloonSVG(size, color) {
    return `<svg width="${size}" height="${size * 2}" viewBox="0 0 40 80"><path d="M20 46 q-6 10 2 18 q6 8 -2 16" stroke="#8a96ad" stroke-width="1.2" fill="none"/><ellipse cx="20" cy="22" rx="16" ry="20" fill="${color}"/><path d="M17 41 h6 l-3 5z" fill="${color}"/><ellipse cx="14" cy="15" rx="4" ry="6" fill="#fff" opacity=".45"/></svg>`;
  }
  function spawnFloaty() {
    if (document.querySelectorAll('.floaty').length > 22) return;
    const f = document.createElement('div');
    f.className = 'floaty';
    const isBalloon = Math.random() < 0.4;
    const c = COLORS[Math.floor(Math.random() * COLORS.length)];
    f.innerHTML = `<div style="animation-duration:${2 + Math.random() * 2}s">${isBalloon ? balloonSVG(26 + Math.random() * 18, c) : heartSVG(16 + Math.random() * 22, c)}</div>`;
    f.style.left = Math.random() * 96 + 'vw';
    f.style.setProperty('--dur', (7 + Math.random() * 6) + 's');
    f.style.opacity = 0.65 + Math.random() * 0.35;
    document.body.appendChild(f);
    f.addEventListener('animationend', ev => { if (ev.target === f) f.remove(); });
  }

  /* =================== CONFETTI =================== */
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  let parts = [], running = false;
  function resize() { const d = window.devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
  addEventListener('resize', resize); resize();
  function confettiBurst() {
    const W = innerWidth, H = innerHeight;
    const add = (x, y, angle, spread, n, speed) => {
      for (let i = 0; i < n; i++) {
        const a = angle + (Math.random() - 0.5) * spread, v = speed * (0.5 + Math.random());
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
          w: 6 + Math.random() * 6, h: 4 + Math.random() * 8, c: COLORS[Math.floor(Math.random() * COLORS.length)],
          shape: Math.random() < 0.2 ? 'heart' : (Math.random() < 0.3 ? 'circle' : 'rect'), life: 0 });
      }
    };
    add(0, H * 0.75, -Math.PI / 3, 0.9, 90, 16);          // left cannon
    add(W, H * 0.75, -Math.PI * 2 / 3, 0.9, 90, 16);      // right cannon
    add(W / 2, H * 0.35, -Math.PI / 2, Math.PI * 2, 70, 9); // center pop
    if (!running) { running = true; requestAnimationFrame(tick); }
  }
  function drawHeart(s) {
    ctx.beginPath(); ctx.moveTo(0, s * .3);
    ctx.bezierCurveTo(-s, -s * .4, -s * .4, -s, 0, -s * .35);
    ctx.bezierCurveTo(s * .4, -s, s, -s * .4, 0, s * .3); ctx.fill();
  }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(q => q.y < innerHeight + 30 && q.life < 600);
    for (const q of parts) {
      q.life++; q.vy += 0.28; q.vx *= 0.985; q.vy *= 0.985; q.x += q.vx + Math.sin(q.life / 12) * 0.6; q.y += q.vy; q.r += q.vr;
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r); ctx.fillStyle = q.c;
      if (q.shape === 'rect') { ctx.scale(1, Math.cos(q.life / 6)); ctx.fillRect(-q.w / 2, -q.h / 2, q.w, q.h); }
      else if (q.shape === 'circle') { ctx.beginPath(); ctx.arc(0, 0, q.w / 2.4, 0, 6.28); ctx.fill(); }
      else drawHeart(q.w * 0.9);
      ctx.restore();
    }
    if (parts.length) requestAnimationFrame(tick); else { running = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }
  // tap anywhere on the opened card for more confetti
  popStage.addEventListener('dblclick', confettiBurst);
});
</script>
